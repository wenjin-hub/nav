<div class="text-center mt-10">
  <div [innerHTML]="$t('_importEnter')" class="mb-4"></div>

  <button nz-button nzType="primary" (click)="onClickFile()">
    {{ $t('_upload') }}
  </button>
  <input
    #file
    type="file"
    (change)="onBookChange($event)"
    accept="text/html"
    class="!hidden"
  />

  <div class="mt-8">
    <div class="mb-4" style="font-size: 13px; color: #999">
      将当前全部导航数据一键导出为浏览器收藏夹 HTML 文件，可在 Chrome / Edge
      的书签管理器中直接导入
    </div>
    <button nz-button (click)="exportBookmarks()">导出收藏夹 HTML</button>
  </div>
</div>
