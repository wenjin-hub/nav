<main class="main">
  <nz-spin
    nzSimple
    *ngIf="commonService.sliceMax === 0"
    class="position-center !z-50 mt-24"
  />
  <app-sidebar [scrollMode]="true" [selectedTwoMap]="selectedTwo" />

  <!-- 右上角访问登录入口 -->
  <app-access-login class="side-access-login" />

  <div class="inner-layout dark-bg">
    <!-- 首页搜索区：置于图片上方，图片取后台「Side 主题图片」第一张 -->
    <app-hero-search
      [images]="commonService.settings().sideThemeImages"
      [height]="commonService.settings().sideThemeHeight || 320"
    />
    <component-group />
    <div class="px-2.5">
      <app-web-list
        [search]="false"
        [overflow]="true"
        [iconSize]="35"
        [max]="9999"
      />
    </div>

    <div class="content" id="content">
      <!-- 搜索模式：保留原有「只显示匹配结果」的渲染 -->
      <ng-container *ngIf="commonService.searchKeyword; else fullPage">
        <div
          class="sticky top-0 left-0 z-10"
          *ngIf="commonService.currentList.length > 1"
        >
          <app-class-tabs [data]="commonService.currentList" />
        </div>
        <div class="box">
          <div *ngIf="commonService.currentList.length > 0; else noData">
            <div
              *ngFor="
                let item of commonService.currentList.slice(
                  0,
                  commonService.sliceMax
                );
                let i = index;
                trackBy: commonService.trackByItem
              "
            >
              <div class="nav-wrapper">
                <app-toolbar-title
                  [dataSource]="item"
                  (onCollapse)="commonService.onCollapse(item)"
                />

                <div
                  [class.hidden]="item['collapsed']"
                  [ngClass]="{
                    'grid gap-x-4 gap-y-3 grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-4':
                      commonService.settings().sideCardStyle !== 'icon',
                    'flex flex-wrap gap-x-6 gap-y-4':
                      commonService.settings().sideCardStyle === 'icon',
                    '2xl:grid-cols-6':
                      commonService.settings().sideCardStyle === 'original' ||
                      commonService.settings().sideCardStyle === 'example',
                  }"
                >
                  <app-card
                    *ngFor="
                      let el of item.nav;
                      trackBy: commonService.trackByItemWeb
                    "
                    [cardStyle]="commonService.settings().sideCardStyle"
                    [dataSource]="el"
                    class="column-border"
                  />
                </div>
              </div>
            </div>
          </div>

          <ng-template #noData>
            <app-no-data />
          </ng-template>
        </div>
      </ng-container>

      <!-- 整页模式：每个一级分类一个区域，标题行带二级标签切换 -->
      <ng-template #fullPage>
        <div class="box">
          <div *ngIf="pageList.length > 0; else noDataFull">
            <div
              *ngFor="
                let one of pageList;
                let oi = index;
                trackBy: commonService.trackByItem
              "
              class="one-block"
            >
              <!-- 一级分类大标题 + 二级标签（锚点） -->
              <div
                class="one-title"
                [id]="'one-' + one.id"
                data-spy="one"
                [attr.data-one-index]="oi"
                [attr.data-one-id]="one.id"
              >
                <app-logo
                  *ngIf="one.icon"
                  [src]="one.icon"
                  [size]="20"
                  [radius]="4"
                  [name]="one.title"
                  class="one-title-icon"
                />
                <span class="one-title-text">{{ one.title }}</span>
                <span class="one-tabs" *ngIf="one.nav.length > 1">
                  <span
                    class="one-tab"
                    *ngFor="let two of one.nav; trackBy: commonService.trackByItem"
                    [class.active]="getActiveTwoId(one) === two.id"
                    (click)="selectTwo(one, two)"
                  >
                    {{ two.title }}
                  </span>
                </span>
              </div>

              <!-- 该区域当前选中二级分类的内容 -->
              <div class="one-body">
                <ng-container
                  *ngFor="let two of one.nav; trackBy: commonService.trackByItem"
                >
                  <div *ngIf="two.id === getActiveTwoId(one)">
                    <!-- 情况1：网址直接挂在二级分类下 -->
                    <ng-container
                      *ngIf="two.nav?.length && two.nav[0]['url']; else threeGroups"
                    >
                      <div class="nav-wrapper">
                        <div
                          [ngClass]="{
                            'grid gap-x-4 gap-y-3 grid-cols-1 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 2xl:grid-cols-5':
                              commonService.settings().sideCardStyle !== 'icon',
                            'flex flex-wrap gap-x-6 gap-y-4':
                              commonService.settings().sideCardStyle === 'icon',
                            '2xl:grid-cols-6':
                              commonService.settings().sideCardStyle ===
                                'original' ||
                              commonService.settings().sideCardStyle === 'example',
                          }"
                        >
                          <app-card
                            *ngFor="
                              let el of two.nav;
                              trackBy: commonService.trackByItemWeb
                            "
                            [cardStyle]="commonService.settings().sideCardStyle"
                            [dataSource]="$any(el)"
                            class="column-border"
                          />
                        </div>
                      </div>
                    </ng-container>
                    <!-- 情况2：二级下是三级分组 -->
                    <ng-template #threeGroups>
                      <div
                        *ngFor="
                          let three of two.nav;
                          trackBy: commonService.trackByItem
                        "
                        class="nav-wrapper"
                      >
                        <!-- 二级下只有一个与二级同名的三级分组时，不重复显示标题 -->
                        <app-toolbar-title
                          *ngIf="two.nav.length > 1 || three.title !== two.title"
                          [dataSource]="three"
                          (onCollapse)="onCollapseThree(three)"
                        />

                        <div
                          [class.hidden]="three['collapsed']"
                          [ngClass]="{
                            'grid gap-x-4 gap-y-3 grid-cols-1 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 2xl:grid-cols-5':
                              commonService.settings().sideCardStyle !== 'icon',
                            'flex flex-wrap gap-x-6 gap-y-4':
                              commonService.settings().sideCardStyle === 'icon',
                            '2xl:grid-cols-6':
                              commonService.settings().sideCardStyle ===
                                'original' ||
                              commonService.settings().sideCardStyle === 'example',
                          }"
                        >
                          <app-card
                            *ngFor="
                              let el of three.nav;
                              trackBy: commonService.trackByItemWeb
                            "
                            [cardStyle]="commonService.settings().sideCardStyle"
                            [dataSource]="$any(el)"
                            class="column-border"
                          />
                        </div>
                      </div>
                    </ng-template>

                    <!-- 分类下没有网址时：仅保留一行卡片高度的空白，不显示大提示框 -->
                    <div class="empty-block" *ngIf="two.nav?.length === 0"></div>
                  </div>
                </ng-container>
              </div>
            </div>
          </div>

          <ng-template #noDataFull>
            <app-no-data />
          </ng-template>
        </div>
      </ng-template>
    </div>

    <app-footer
      className="side-footer"
      [content]="commonService.settings().sideFooterHTML"
    />
  </div>
</main>

<app-fixbar
  (onCollapse)="commonService.onCollapseAll($event)"
  [collapsed]="commonService.collapsed"
/>
