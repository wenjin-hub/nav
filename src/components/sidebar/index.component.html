<nz-sider
  class="sider-compnent"
  [class.showSidebar]="openSidebar"
  nzCollapsible
  [(nzCollapsed)]="isCollapsed"
  [nzTrigger]="null"
>
  <div
    *ngIf="openSidebar"
    class="mask block md:hidden"
    (click)="toggleSidebar(false)"
  ></div>

  <div class="mobile-collapse flex md:hidden" (click)="toggleSidebar()">
    <nz-icon
      *ngIf="!openSidebar"
      nzType="double-right"
      nzTheme="outline"
      class="text-base !text-gray-500"
    />
    <nz-icon
      *ngIf="openSidebar"
      nzType="double-left"
      nzTheme="outline"
      class="text-base !text-gray-500"
    />
  </div>

  <div
    class="logo dark-bg dark-border-color2 pointer-events-none md:pointer-events-auto"
    (click)="handleCollapsed()"
  >
    <ng-content *ngIf="logoImage; else noLogo">
      <img
        [src]="commonService.settings().favicon"
        class="logo-img"
        *ngIf="isCollapsed; else noCollased"
      />
      <ng-template #noCollased>
        <img class="pointer-events-none" [src]="logoImage" />
      </ng-template>
    </ng-content>

    <ng-template #noLogo>
      <img [src]="commonService.settings().favicon" class="logo-img" />
      <span class="web-title" *ngIf="!isCollapsed">{{
        commonService.settings().sideTitle || commonService.title()
      }}</span>
    </ng-template>
  </div>

  <!-- 整页滚动模式：自定义菜单（悬停浮层显示二级，点击直接滚动） -->
  <div class="sider spy-menu dark-bg select-none" *ngIf="scrollMode">
    <div
      class="spy-item"
      *ngFor="
        let one of commonService.navs();
        let i = index;
        trackBy: commonService.trackByItem
      "
      [class.active]="commonService.oneIndex === i"
      (mouseenter)="onHoverOne(one, $event)"
      (mouseleave)="onLeaveOne()"
    >
      <div class="spy-row" (click)="onClickOne(one)">
        <app-logo
          *ngIf="one.icon"
          [src]="one.icon"
          class="mr-2.5 flex-center"
          [size]="25"
          [radius]="0"
          [name]="one.title"
        />
        <span class="spy-title ellipsis">{{ one.title }}</span>
        <span class="spy-arrow" *ngIf="one.nav?.length">›</span>
      </div>

      <!-- 悬停浮层：二级目录列表 -->
      <div
        class="spy-flyout dark-bg"
        *ngIf="hoverOneId === one.id && one.nav?.length"
        [style.top.px]="flyoutTop"
        [style.left.px]="flyoutLeft"
      >
        <div
          class="spy-flyout-item"
          *ngFor="
            let two of one.nav;
            trackBy: commonService.trackByItem
          "
          [class.active]="isTwoActive(one, two)"
          (click)="onClickTwo(one, two)"
        >
          <app-logo
            *ngIf="two.icon"
            [src]="two.icon"
            class="mr-2 flex-center"
            [size]="22"
            [radius]="0"
            [name]="two.title"
          />
          <span class="ellipsis">{{ two.title }}</span>
        </div>
      </div>
    </div>
  </div>

  <!-- 其他主题：原有菜单结构（保持不变） -->
  <ul
    nz-menu
    nzMode="inline"
    class="sider dark-bg select-none auto-scrollbar"
    *ngIf="!scrollMode"
  >
    <li
      nz-submenu
      *ngFor="
        let item of commonService.navs();
        index as pageIdx;
        trackBy: commonService.trackByItem
      "
      (nzOpenChange)="openMenu(item)"
      [nzTitle]="titleTpl"
      [nzOpen]="item.id === menuOpenId"
    >
      <ng-template #titleTpl>
        <app-logo
          *ngIf="item.icon"
          [src]="item.icon"
          class="mr-2.5 flex-center sideicon"
          [size]="25"
          [radius]="0"
          [name]="item.title"
        />
        <span class="menu-title ellipsis">{{
          isCollapsed && item.icon
            ? ''
            : isCollapsed && !item.icon
              ? item.title
              : item.title
        }}</span>
      </ng-template>

      <ul>
        <li
          nz-menu-item
          *ngFor="
            let el of item.nav;
            let idIdx = index;
            trackBy: commonService.trackByItem
          "
          [nzSelected]="
            commonService.oneIndex === pageIdx &&
            commonService.twoIndex === idIdx
          "
          (click)="onClickNav(el)"
        >
          <app-logo
            *ngIf="el.icon"
            [src]="el.icon"
            class="mr-2 flex-center"
            [size]="25"
            [radius]="0"
            [name]="el.title"
          />
          <span class="ellipsis">{{ el.title }}</span>

          <div
            *ngIf="
              commonService.oneIndex === pageIdx &&
              commonService.twoIndex === idIdx
            "
            (click)="commonService.onCollapseAll($event)"
            class="collapse-wrapper"
          >
            <i
              *ngIf="!isCollapsed"
              class="iconfont iconweibiaoti25 collapseIcon"
              [class.active]="commonService.collapsed"
            >
            </i>
          </div>
        </li>
      </ul>
    </li>
  </ul>
</nz-sider>
